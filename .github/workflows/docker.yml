name: Docker image

# Builds docker/Dockerfile, checks that a Playwright client can drive the
# browser through it, and pushes it to ghcr.io/<owner>/camoufox.

on:
  push:
    branches: [main, docker-image]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/camoufox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: camoufox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name camoufox -p 3000:3000 camoufox:test
          pip install "playwright<1.63"
          python - <<'EOF'
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              for attempt in range(30):
                  try:
                      browser = p.firefox.connect("ws://localhost:3000/camoufox")
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit("server did not come up")
              page = browser.new_page()
              page.goto("https://example.com")
              print("title:", page.title())
              print("ua:", page.evaluate("navigator.userAgent"))
              browser.close()
          EOF

      - name: Server logs
        if: always()
        run: docker logs camoufox || true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
